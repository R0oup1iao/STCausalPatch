# 1. 训练器配置
trainer:
  max_epochs: 200
  gpus: 1
  check_val_every_n_epoch: 5
  # ... (其他 Pytorch Lightning Trainer 参数)

# 2. 数据配置 (用于 DataModule 和模型)
data:
  data_path: "./data/example_data.npy"  # 修改为你的数据路径
  mask_path: "./data/example_mask.npy"  # 修改为你的掩码路径
  n_nodes: 10          # 必须！改为你的节点数
  data_dim: 1          # 必须！改为你的特征维度
  input_step: 10
  pred_step: 1         # 重要：原模型似乎只支持 pred_step=1
  batch_size: 64
  num_workers: 4
  block_size: null     # (可选)

# 3. 预测模型配置 (用于 CUTSModel)
model:
  temporal_hidden_dim: 32   # (H_t) TemporalMLP 的输出维度
  temporal_mlp_hidden: 64   # TemporalMLP 的中间层维度
  
  spatial_embed_dim: 64     # (E) Transformer 的 d_model
  spatial_n_heads: 4
  spatial_ffn_dim: 128
  spatial_n_layers: 2
  
  prediction_head_hidden: 64 # 预测头的隐藏维度

# 4. 优化器配置
optimizer:
  data_pred: # 预测模型优化器
    lr_data_start: 0.001
    lr_data_end: 0.0001
    weight_decay: 0.0001
  graph_discov: # 因果图优化器
    lr_graph_start: 0.01
    lr_graph_end: 0.001

# 5. 因果发现配置 (用于 CausalGraphLearner)
causal:
  n_groups_start: 10  # 初始 G 矩阵的组数 (如果 group_policy=None, 设为 n_nodes)
  group_policy: "None" # e.g., "mul_2_every_10" or "None"
  
  start_tau: 1.0
  end_tau: 0.1
  
  lambda_s_start: 0.1
  lambda_s_end: 0.1